      if (calcAddOns.includes(id)) {
        calcAddOns = calcAddOns.filter(x => x !== id);
      } else {
        calcAddOns.push(id);
      }
      document.getElementById('slideContent').innerHTML = renderCalculatorHtml();
    }

    function orderViaWhatsApp() {
      const base = packageData[calcPackage];
      const addOnsTotal = calcAddOns.reduce((sum, id) => {
        if (id === 'payment_gateway_starter' && (calcPackage === 'standard' || calcPackage === 'pro')) return sum;
        const item = addOnData.find(a => a.id === id);
        return sum + (item ? item.price : 0);
      }, 0);
      const grandTotal = base.price + addOnsTotal;

      const addOnNames = calcAddOns
        .filter(id => !(id === 'payment_gateway_starter' && (calcPackage === 'standard' || calcPackage === 'pro')))
        .map(id => addOnData.find(a => a.id === id)?.name)
        .filter(Boolean);

      const msg = `Halo Tim Pengembang Platform Al Madraj,

Saya telah melihat simulasi di website penawaran dan tertarik untuk mendiskusikan paket berikut:

Paket Utama: Paket ${base.name} (${base.formatted} - ${base.gatewayIncluded ? 'Termasuk Payment Gateway Otomatis (QRIS & VA) & Domain .com 1 Thn' : 'Termasuk Domain .com 1 Thn'})
${addOnNames.length > 0 ? `Optional Add-on:\n${addOnNames.map(n => `- ${n}`).join('\n')}\n` : ''}
Estimasi Total Investasi: Rp ${grandTotal.toLocaleString('id-ID')}

Mohon informasi langkah selanjutnya untuk penjadwalan diskusi project ini. Terima kasih.`;

      window.open(`https://wa.me/6281311506025?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function updateSlide() {
      const container = document.getElementById('slideContent');
      container.className = 'w-full max-w-4xl animate-slide-in';
      container.innerHTML = getSlideHtml(currentSlide);

      document.getElementById('navSlideNumber').innerText = `Slide ${currentSlide + 1} dari 12:`;
      document.getElementById('navSlideTitle').innerText = SLIDES[currentSlide].title;
      document.getElementById('bottomSlideCounter').innerText = currentSlide + 1;

      document.getElementById('btnPrevSlide').disabled = currentSlide === 0;
      document.getElementById('btnPrevSlide').className = currentSlide === 0
        ? 'px-3 py-1 text-xs text-slate-300 opacity-40 cursor-not-allowed'
        : 'px-3 py-1 text-xs text-slate-600 hover:text-slate-900 transition-colors';

      document.getElementById('btnNextText').innerText = currentSlide === SLIDES.length - 1 ? 'Selesai' : 'Lanjut';
    }

    function nextSlide() {
      if (currentSlide < SLIDES.length - 1) {
        currentSlide++;
        updateSlide();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        updateSlide();
      }
    }

    function jumpToSlide(idx) {
      if (idx >= 0 && idx < SLIDES.length) {
        currentSlide = idx;
        updateSlide();
        closeThumbnails();
      }
    }

    function setViewMode(mode) {
      viewMode = mode;
      const pres = document.getElementById('presentationContainer');
      const doc = document.getElementById('documentContainer');
      const bottom = document.getElementById('bottomControls');
      const btnDeck = document.getElementById('btnModeDeck');
      const btnDoc = document.getElementById('btnModeDoc');

      if (mode === 'presentation') {
        pres.classList.remove('hidden');
        doc.classList.add('hidden');
        bottom.classList.remove('hidden');
        btnDeck.className = 'px-2.5 py-1 rounded-md bg-white text-slate-900 font-medium transition-colors shadow-xs';
        btnDoc.className = 'px-2.5 py-1 rounded-md text-slate-500 hover:text-slate-900 transition-colors';
        updateSlide();
      } else {
        pres.classList.add('hidden');
        doc.classList.remove('hidden');
        bottom.classList.add('hidden');
        btnDoc.className = 'px-2.5 py-1 rounded-md bg-white text-slate-900 font-medium transition-colors shadow-xs';
        btnDeck.className = 'px-2.5 py-1 rounded-md text-slate-500 hover:text-slate-900 transition-colors';
        
        document.getElementById('documentContent').innerHTML = SLIDES.map((s, idx) => `
          <section id="${s.id}" class="print-break space-y-2 border-b border-slate-200 pb-10">
            <div class="text-xs text-slate-400 font-medium no-print">Slide ${idx + 1} dari 12: ${s.title}</div>
            ${getSlideHtml(idx)}
          </section>
        `).join('');
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
      }
    }

    function openThumbnails() {
      const grid = document.getElementById('thumbnailsGrid');
      grid.innerHTML = SLIDES.map((s, i) => `
        <div onclick="jumpToSlide(${i})" class="p-3 border rounded-xl cursor-pointer text-left transition-all ${i === currentSlide ? 'border-[#007a87] bg-teal-50/50' : 'border-slate-200 hover:border-slate-300'}">
          <div class="text-[11px] text-slate-400 mb-1">Slide ${i + 1}</div>
          <div class="font-semibold text-xs text-slate-900 mb-0.5">${s.title}</div>
          <div class="text-[11px] text-slate-500">${s.subtitle}</div>
        </div>
      `).join('');
      document.getElementById('thumbnailsModal').classList.remove('hidden');
      document.getElementById('thumbnailsModal').classList.add('flex');
    }

    function closeThumbnails() {
      document.getElementById('thumbnailsModal').classList.add('hidden');
      document.getElementById('thumbnailsModal').classList.remove('flex');
    }

    window.addEventListener('keydown', (e) => {
      if (['input', 'textarea'].includes(e.target?.tagName?.toLowerCase())) return;
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        if (viewMode === 'presentation') { e.preventDefault(); nextSlide(); }
      } else if (e.key === 'ArrowLeft' || e.key === 'Backspace' || e.key === 'PageUp') {
        if (viewMode === 'presentation') { e.preventDefault(); prevSlide(); }
      } else if (e.key === 'Home') {
        if (viewMode === 'presentation') { e.preventDefault(); jumpToSlide(0); }
      } else if (e.key === 'End') {
        if (viewMode === 'presentation') { e.preventDefault(); jumpToSlide(SLIDES.length - 1); }
      } else if (e.key === 'f' || e.key === 'F') {
        e.preventDefault();
        toggleFullscreen();
      } else if (e.key === 'm' || e.key === 'M') {
        e.preventDefault();
        setViewMode(viewMode === 'presentation' ? 'document' : 'presentation');
      } else if (e.key === 'g' || e.key === 'G') {
        e.preventDefault();
        openThumbnails();
      } else if (e.key === 'Escape') {
        closeThumbnails();
      }
    });

    updateSlide();
  </script>
</body>
</html>
