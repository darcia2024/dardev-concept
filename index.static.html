          <div class="text-[11px] text-neutral-500">${s.subtitle}</div>
        </div>
      `).join('');
      document.getElementById('thumbnailsModal').classList.remove('hidden');
      document.getElementById('thumbnailsModal').classList.add('flex');
    }

    function closeThumbnails() {
      document.getElementById('thumbnailsModal').classList.add('hidden');
      document.getElementById('thumbnailsModal').classList.remove('flex');
    }

    window.addEventListener('keydown', (e) => {
      if (['input', 'textarea'].includes(e.target?.tagName?.toLowerCase())) return;
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        if (viewMode === 'presentation') { e.preventDefault(); nextSlide(); }
      } else if (e.key === 'ArrowLeft' || e.key === 'Backspace' || e.key === 'PageUp') {
        if (viewMode === 'presentation') { e.preventDefault(); prevSlide(); }
      } else if (e.key === 'Home') {
        if (viewMode === 'presentation') { e.preventDefault(); jumpToSlide(0); }
      } else if (e.key === 'End') {
        if (viewMode === 'presentation') { e.preventDefault(); jumpToSlide(SLIDES.length - 1); }
      } else if (e.key === 'f' || e.key === 'F') {
        e.preventDefault();
        toggleFullscreen();
      } else if (e.key === 'm' || e.key === 'M') {
        e.preventDefault();
        setViewMode(viewMode === 'presentation' ? 'document' : 'presentation');
      } else if (e.key === 'g' || e.key === 'G') {
        e.preventDefault();
        openThumbnails();
      } else if (e.key === 'Escape') {
        closeThumbnails();
      }
    });

    updateSlide();
  </script>
</body>
</html>
