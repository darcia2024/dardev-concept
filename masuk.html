<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2A0607" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Masuk &mdash; Underrated Barbershop</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Bobot berhenti di 600. Sistem ini tidak memakai huruf tebal. -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="theme.css" />

  <style>
    /* =========================================================================
       HALAMAN MASUK — kartu terbelah

       Satu-satunya layar dalam sistem ini yang sengaja berlatar gelap. Sisanya
       terang, sesuai permintaan klien. Di sini gelap justru bekerja: layar ini
       dibuka sekali lalu ditinggalkan, dan latar pekat membuat kartu putihnya
       terangkat seperti benda yang diletakkan di atas meja.

       Warnanya maroon, bukan hitam — diturunkan dari merah #BE0000 pada logo,
       supaya latar terasa dipilih dan bukan sekadar gelap.
       ========================================================================= */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --pekat:   #2A0607;
      --pekat-2: #1C0304;
      --kartu:   #FFFFFF;
    }

    body {
      background: var(--pekat);
      background-image: radial-gradient(120% 100% at 50% 0%, #3A0A0B 0%, var(--pekat) 46%, var(--pekat-2) 100%);
      color: var(--text);
      font-family: var(--sans);
      font-weight: var(--w-reg);
      font-size: 15px;
      line-height: 1.55;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: clamp(16px, 4vw, 56px);
      -webkit-font-smoothing: antialiased;
    }

    /* Jendela pendek: kurangi napas di luar kartu sebelum mengurangi isinya */
    @media (min-width: 861px) and (max-height: 780px) {
      body { padding: 24px; }
      .kartu { padding: 22px; gap: clamp(28px, 4vw, 52px); }
    }

    /* ---- Kartu ---- */
    .kartu {
      width: 100%;
      max-width: 1000px;
      background: var(--kartu);
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 40px 90px rgba(0,0,0,.42), 0 4px 14px rgba(0,0,0,.22);
      display: grid;
      grid-template-columns: minmax(0, 420px) 1fr;
      gap: clamp(32px, 5vw, 68px);
      align-items: stretch;
    }

    /* ---- Panel gambar: identitas ada di sini, bukan di sisi formulir ------
       Gambar berbentuk persegi sementara panelnya potret 3:4. Dengan
       object-fit:cover yang terlihat adalah 75% lebar tengah; wordmark
       menempati 20,9%–78,9% sehingga tersisa margin sekitar 8% di kedua sisi.
       Diukur, bukan dikira-kira. */
    .panel-gambar {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      background: #EDEFF2;
      aspect-ratio: 3 / 4;
      /* Pada layar pendek rasio 3:4 membuat kartu melampaui tinggi jendela dan
         bagian bawahnya terpotong. Batas ini membuat panel memendek lebih dulu
         — aspect-ratio mengalah pada max-height — sehingga kartunya tetap utuh
         tanpa perlu menggulir. Wordmark tetap terlihat: sudah diuji utuh sampai
         rasio 16:9. */
      max-height: calc(100dvh - 128px);
    }
    .panel-gambar img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: 50% 52%;   /* wordmark berpusat di 53,6% — digeser sedikit
                                     agar duduk optis di tengah panel */
      display: block;
    }

    /* ---- Kolom formulir ---- */
    .sisi {
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 380px;
      width: 100%;
      padding: 8px 0;
      min-width: 0;
    }
    /* align-self wajib: .sisi adalah flex kolom, dan align-items bawaannya
       stretch. Tanpa ini gambar diregangkan selebar kolom sementara tingginya
       tetap 26px — logonya gepeng, dan 'width:auto' tidak menolong karena yang
       meregangkan adalah sumbu silang, bukan lebar intrinsiknya. */
    .tanda {
      height: 26px; width: auto;
      align-self: flex-start;
      display: block;
      margin-bottom: 22px;
    }

    h1 {
      font-size: 34px;
      font-weight: var(--w-semi);
      letter-spacing: -.032em;
      line-height: 1.12;
      color: var(--text);
    }
    .sub { font-size: 14px; color: var(--text-dim); margin-top: 8px; line-height: 1.5; }
    .garis { height: 1px; background: var(--border); margin: 26px 0; }

    .medan { display: flex; flex-direction: column; gap: 7px; margin-bottom: 16px; }
    .label { font-size: 13.5px; color: var(--text-mid); }

    input {
      width: 100%;
      height: 50px;
      padding: 0 15px;
      font-family: var(--sans);
      font-size: 15.5px;
      font-weight: var(--w-reg);
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    input::placeholder { color: var(--text-dim); }
    input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px var(--brand-wash);
    }

    .btn {
      width: 100%;
      height: 52px;
      margin-top: 10px;
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: var(--sans);
      font-size: 15.5px;
      font-weight: var(--w-med);
      letter-spacing: -.01em;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(190,0,0,.24);
      transition: transform .12s ease, box-shadow .18s ease, background .18s ease;
    }
    .btn:hover:not(:disabled) { background: var(--brand-deep, #9E0000); }
    .btn:active:not(:disabled) { transform: scale(.99); }
    .btn:disabled { background: var(--surface-sunk); color: var(--text-dim); box-shadow: none; cursor: default; }

    .kaki { margin-top: 16px; text-align: center; font-size: 13.5px; color: var(--text-dim); }
    .kaki a { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--border); padding-bottom: 1px; }
    .kaki a:hover { border-bottom-color: var(--brand); color: var(--brand); }

    .err {
      font-size: 13px;
      color: var(--brand-deep, #9E0000);
      background: var(--brand-wash);
      border: 1px solid var(--brand-line);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 14px;
      line-height: 1.45;
    }

    /* ---- Memeriksa sesi ---- */
    /* [hidden] bawaan browser memakai display:none, dan aturan display apa pun
       di bawahnya mengalahkannya. Tanpa baris kedua, indikator ini tetap tampil
       setelah formulirnya muncul. */
    .memuat[hidden] { display: none; }
    .memuat {
      display: flex; align-items: center; gap: 11px;
      font-size: 14px; color: var(--text-dim);
      min-height: 240px;
    }
    .titik {
      width: 16px; height: 16px; flex: none;
      border: 2px solid var(--border);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: putar .7s linear infinite;
    }
    @keyframes putar { to { transform: rotate(360deg); } }

    /* ---- Layar sempit: panel jadi pita di atas formulir ------------------
       Rasio dilonggarkan ke 16:9. Wordmark menempati y 47,8%–59,4%, dan pada
       16:9 yang terlihat adalah y 21,9%–78,1% — masih utuh. */
    @media (max-width: 860px) {
      .kartu {
        grid-template-columns: 1fr;
        gap: 26px;
        padding: 20px;
        border-radius: 24px;
        max-width: 460px;
      }
      .panel-gambar { aspect-ratio: 16 / 9; min-height: 0; }
      .sisi { max-width: none; padding: 0 2px 4px; }
      /* Panel gambar sudah membawa wordmark dan kini duduk tepat di atas
         formulir. Menampilkan logo kedua berjarak beberapa piksel darinya
         membuat keduanya terbaca sebagai kesalahan, bukan komposisi. */
      .tanda { display: none; }
      h1 { font-size: 29px; }
      .garis { margin: 22px 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn, input { transition: none; }
      .btn:active:not(:disabled) { transform: none; }
      .titik { animation-duration: 2s; }
    }
  </style>
</head>
<body>

  <div class="kartu">

    <div class="panel-gambar">
      <picture>
        <source srcset="assets/login-panel.webp" type="image/webp" />
        <img src="assets/login-panel.jpg" alt="Underrated Barbershop" width="1200" height="1200" />
      </picture>
    </div>

    <div class="sisi">
      <img src="assets/logo.png" alt="" class="tanda" aria-hidden="true" />

      <!-- Memeriksa sesi yang mungkin masih tersimpan -->
      <div class="memuat" id="viewLoading">
        <div class="titik"></div>
        <div>Memeriksa sesi&hellip;</div>
      </div>

      <form id="viewLogin" hidden autocomplete="on">
        <h1>Masuk</h1>
        <p class="sub">Owner dan capster masuk di sini. Kasir cukup memakai PIN di perangkat outlet.</p>

        <div class="garis"></div>

        <div class="err" id="loginErr" hidden></div>

        <div class="medan">
          <label class="label" for="inpEmail">Email</label>
          <input type="email" id="inpEmail" name="email" autocomplete="username"
                 placeholder="nama@underrated.com" required />
        </div>

        <div class="medan">
          <label class="label" for="inpPass">Kata sandi</label>
          <input type="password" id="inpPass" name="password" autocomplete="current-password"
                 placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required />
        </div>

        <button type="submit" class="btn" id="btnLogin">Masuk</button>

        <div class="kaki">
          Bertugas sebagai kasir? <a href="/pos">Buka POS</a>
        </div>
      </form>
    </div>

  </div>

  <script src="vendor/supabase.js"></script>
  <script src="sb-app.js"></script>

  <script>
    /* =========================================================================
       HALAMAN MASUK — pintu tunggal, perutean berdasarkan peran

       Sebelumnya ada tiga kartu peran di layar ini. Kartu itu tidak pernah
       menentukan kewenangan — tujuan selalu diambil dari kolom role di tabel
       profiles — sehingga satu-satunya kegunaan nyatanya hanyalah tautan ke
       /pos. Tautan itu kini berdiri sendiri di bawah tombol, dan layarnya
       menjadi satu formulir tanpa kehilangan fungsi apa pun.

       Tiap halaman tujuan tetap memeriksa ulang perannya sendiri, dengan RLS
       di basis data sebagai lapis terakhir.
       ========================================================================= */

    const TUJUAN = {
      owner:      '/rekap',
      capster:    '/capster',
      pos_device: '/pos',
      kasir:      '/pos'
    };

    const $ = id => document.getElementById(id);
    const errEl = $('loginErr');

    function tampilkan(view) {
      ['viewLoading', 'viewLogin'].forEach(v => { $(v).hidden = v !== view; });
    }

    /** Arahkan berdasarkan peran sebenarnya di basis data. */
    function arahkan(peran) {
      const tujuan = TUJUAN[peran];
      if (!tujuan) {
        errEl.textContent = 'Akun ini belum diberi peran. Hubungi owner.';
        errEl.hidden = false;
        tampilkan('viewLogin');
        return false;
      }
      location.replace(tujuan);
      return true;
    }

    $('viewLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.hidden = true;
      const btn = $('btnLogin');
      btn.disabled = true;
      btn.textContent = 'Memeriksa…';

      const { data, error } = await sb.auth.signInWithPassword({
        email: $('inpEmail').value.trim(),
        password: $('inpPass').value
      });

      btn.disabled = false;
      btn.textContent = 'Masuk';

      if (error) {
        errEl.textContent = /invalid/i.test(error.message)
          ? 'Email atau kata sandi salah.'
          : 'Gagal masuk: ' + error.message;
        errEl.hidden = false;
        return;
      }

      const { profile } = await sbLoadProfile(data.user);
      arahkan(profile.role);
    });

    // Sesi yang masih hidup langsung diteruskan, tanpa login ulang
    (async function boot() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { tampilkan('viewLogin'); return; }
      const { profile } = await sbLoadProfile(session.user);
      if (!arahkan(profile.role)) tampilkan('viewLogin');
    })();
  </script>
</body>
</html>
