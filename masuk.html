<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F4F5F7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Masuk &mdash; Barber Membership System</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Bobot berhenti di 600. Sistem ini tidak memakai huruf tebal. -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="theme.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      /* Konten diletakkan sedikit di atas tengah optik, bukan tepat di tengah
         geometris — halaman pendek yang benar-benar terpusat terasa melayang. */
      align-items: flex-start;
      padding: clamp(48px, 14vh, 132px) 20px 48px;
    }

    .shell {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 26px;
    }

    /* ---------- Identitas ---------- */
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
    }
    .brand p {
      font-size: 11px;
      font-weight: var(--w-med);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    /* Garis rambut merah: satu-satunya aksen merek di layar ini,
       cukup untuk menandai identitas tanpa berisik. */
    .brand::after {
      content: "";
      width: 34px;
      height: 2px;
      background: var(--brand);
      border-radius: 2px;
    }
    .brand p {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--fg-dim);
    }

    /* ---------- Pilihan peran ---------- */
    .roles { display: flex; flex-direction: column; gap: 10px; }

    .role-card {
      position: relative;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 15px;
      cursor: pointer;
      text-align: left;
      width: 100%;
      color: inherit;
      font: inherit;
      text-decoration: none;
      box-shadow: var(--shadow-sm);
      transition: border-color .16s ease, box-shadow .16s ease, transform .16s ease;
    }
    /* Batang merah muncul dari tepi kiri saat disorot */
    .role-card::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--brand);
      transform: scaleY(0);
      transform-origin: center;
      transition: transform .18s ease;
    }
    .role-card:hover, .role-card:focus-visible {
      border-color: var(--border);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
      outline: none;
    }
    .role-card:hover::before, .role-card:focus-visible::before { transform: scaleY(1); }
    .role-card:hover .role-arrow { color: var(--brand); transform: translateX(3px); }
    .role-card:hover .role-icon { color: var(--brand); border-color: var(--brand-line); }

    .role-icon {
      width: 40px; height: 40px; flex: none;
      border-radius: 11px;
      background: var(--surface-sunk);
      border: 1px solid var(--border);
      display: grid; place-items: center;
      color: var(--text-mid);
      transition: color .16s ease, border-color .16s ease;
    }
    .role-icon svg { width: 19px; height: 19px; display: block; }

    .role-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .role-name { font-size: 15.5px; font-weight: var(--w-semi); letter-spacing: -.01em; }
    .role-desc { font-size: 12.5px; color: var(--text-dim); line-height: 1.45; }
    .role-arrow {
      margin-left: auto; flex: none;
      color: var(--border); display: grid; place-items: center;
      transition: color .16s ease, transform .16s ease;
    }
    .role-arrow svg { width: 17px; height: 17px; display: block; }

    /* ---------- Formulir ---------- */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-md);
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .panel-top { display: flex; align-items: center; gap: 12px; }
    .btn-back {
      background: none; border: none; cursor: pointer;
      color: var(--fg-dim); font-size: 19px; line-height: 1;
      padding: 2px 4px; font-family: inherit;
    }
    .btn-back:hover { color: var(--fg); }
    .panel-title { font-size: 16px; font-weight: 600; }
    .panel-sub { font-size: 12px; color: var(--fg-dim); }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .label {
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--fg-dim);
    }
    input {
      border-radius: var(--r-sm);
      padding: 12px 13px;
      font-size: 15px;
      width: 100%;
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    .btn-primary {
      border-radius: var(--r-sm);
      padding: 13px;
      font-size: 14.5px;
      font-family: inherit;
      cursor: pointer;
    }

    .err {
      font-size: 13px;
      color: var(--brand-deep);
      background: var(--brand-wash);
      border: 1px solid var(--brand-line);
      border-radius: var(--r-sm);
      padding: 10px 12px;
      line-height: 1.45;
    }
    [hidden] { display: none !important; }

    .foot {
      text-align: center;
      font-size: 11.5px;
      color: var(--fg-dim);
      line-height: 1.6;
    }
    .foot a { color: var(--brand); text-decoration: none; }
    .foot a:hover { color: var(--brand-deep); }

    .spinner {
      display: grid; place-items: center; gap: 12px;
      padding: 30px 0; text-align: center;
      color: var(--fg-dim); font-size: 13px;
    }
    .spinner-dot {
      width: 26px; height: 26px;
      border: 2px solid var(--line);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="shell">

    <div class="brand">
      <img src="assets/logo.png" alt="Underrated Barbershop" class="brandmark brandmark--xl" />
      <p>Sistem Kasir &amp; Membership</p>
    </div>

    <!-- Memeriksa sesi yang mungkin masih tersimpan -->
    <div class="spinner" id="viewLoading">
      <div class="spinner-dot"></div>
      <div>Memeriksa sesi…</div>
    </div>

    <!-- Pemilihan peran -->
    <div class="roles" id="viewRoles" hidden>
      <button class="role-card" data-role="owner">
        <span class="role-icon"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M3 8.5l3.6 2.6L12 4.5l5.4 6.6L21 8.5l-1.7 9.1a1.4 1.4 0 0 1-1.4 1.1H6.1a1.4 1.4 0 0 1-1.4-1.1L3 8.5Z"/></svg></span>
        <span class="role-text">
          <span class="role-name">Owner</span>
          <span class="role-desc">Laporan, data pegawai, pengaturan &mdash; akses penuh</span>
        </span>
        <span class="role-arrow"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M5 12h13M12.5 6.5 18.5 12l-6 5.5"/></svg></span>
      </button>

      <a class="role-card" href="/pos" data-role="kasir">
        <span class="role-icon"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="2.5" y="5.5" width="19" height="13" rx="2.2"/><path d="M2.5 10h19M6.5 14.5h4"/></svg></span>
        <span class="role-text">
          <span class="role-name">Kasir</span>
          <span class="role-desc">Masuk dengan PIN di perangkat outlet</span>
        </span>
        <span class="role-arrow"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M5 12h13M12.5 6.5 18.5 12l-6 5.5"/></svg></span>
      </a>

      <button class="role-card" data-role="capster">
        <span class="role-icon"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="6" cy="18" r="2.6"/><circle cx="18" cy="18" r="2.6"/><path d="M7.9 16.1 19.5 4.5M16.1 16.1 4.5 4.5"/></svg></span>
        <span class="role-text">
          <span class="role-name">Capster</span>
          <span class="role-desc">Lihat kinerja Anda sendiri hari ini</span>
        </span>
        <span class="role-arrow"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M5 12h13M12.5 6.5 18.5 12l-6 5.5"/></svg></span>
      </button>
    </div>

    <!-- Formulir akun (owner & capster) -->
    <form class="panel" id="viewLogin" hidden autocomplete="on">
      <div class="panel-top">
        <button type="button" class="btn-back" id="btnBack" aria-label="Kembali">←</button>
        <div>
          <div class="panel-title" id="loginTitle">Masuk</div>
          <div class="panel-sub" id="loginSub"></div>
        </div>
      </div>

      <div class="field">
        <label class="label" for="inpEmail">Email</label>
        <input type="email" id="inpEmail" name="email" autocomplete="username" required />
      </div>
      <div class="field">
        <label class="label" for="inpPass">Kata Sandi</label>
        <input type="password" id="inpPass" name="password" autocomplete="current-password" required />
      </div>

      <div class="err" id="loginErr" hidden></div>
      <button type="submit" class="btn-primary" id="btnLogin">Masuk</button>
    </form>

    <div class="foot" id="footNote" hidden>
      Kasir tidak memakai email &mdash; cukup PIN di perangkat outlet.<br />
      Lupa kata sandi atau PIN? Hubungi owner.
    </div>
  </div>

  <script src="vendor/supabase.js"></script>
  <script src="sb-app.js"></script>

  <script>
    /* =========================================================================
       HALAMAN MASUK — pintu tunggal, perutean berdasarkan peran

       Kartu peran hanya membantu orang memilih; kewenangan TIDAK pernah
       diambil dari pilihan itu. Setelah login, tujuan ditentukan dari
       kolom role di tabel profiles — dan tiap halaman tujuan memeriksa
       ulang perannya sendiri, dengan RLS di database sebagai lapis terakhir.
       ========================================================================= */

    const TUJUAN = {
      owner:      '/rekap',
      capster:    '/capster',
      pos_device: '/pos',
      kasir:      '/pos'
    };

    const SALINAN = {
      owner:   { judul: 'Masuk sebagai Owner',   sub: 'Akses penuh ke seluruh sistem' },
      capster: { judul: 'Masuk sebagai Capster', sub: 'Kinerja Anda sendiri, hari ini dan bulan ini' }
    };

    const $ = id => document.getElementById(id);
    const errEl = $('loginErr');
    let peranDipilih = 'owner';

    function tampilkan(view) {
      ['viewLoading', 'viewRoles', 'viewLogin'].forEach(v => { $(v).hidden = v !== view; });
      $('footNote').hidden = view === 'viewLoading';
    }

    function bukaFormulir(peran) {
      peranDipilih = peran;
      errEl.hidden = true;
      $('loginTitle').textContent = SALINAN[peran].judul;
      $('loginSub').textContent = SALINAN[peran].sub;
      tampilkan('viewLogin');
      $('inpEmail').focus();
    }

    document.querySelectorAll('.role-card[data-role]').forEach(el => {
      if (el.tagName === 'A') return;   // kartu kasir adalah tautan biasa ke /pos
      el.addEventListener('click', () => bukaFormulir(el.dataset.role));
    });

    $('btnBack').addEventListener('click', () => { errEl.hidden = true; tampilkan('viewRoles'); });

    /** Arahkan berdasarkan peran sebenarnya di basis data, bukan kartu yang ditekan. */
    function arahkan(peran) {
      const tujuan = TUJUAN[peran];
      if (!tujuan) {
        errEl.textContent = 'Akun ini belum diberi peran. Hubungi owner.';
        errEl.hidden = false;
        tampilkan('viewLogin');
        return false;
      }
      location.replace(tujuan);
      return true;
    }

    $('viewLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.hidden = true;
      const btn = $('btnLogin');
      btn.disabled = true;
      btn.textContent = 'Memeriksa…';

      const { data, error } = await sb.auth.signInWithPassword({
        email: $('inpEmail').value.trim(),
        password: $('inpPass').value
      });

      btn.disabled = false;
      btn.textContent = 'Masuk';

      if (error) {
        errEl.textContent = /invalid/i.test(error.message)
          ? 'Email atau kata sandi salah.'
          : 'Gagal masuk: ' + error.message;
        errEl.hidden = false;
        return;
      }

      const { profile } = await sbLoadProfile(data.user);

      // Beri tahu bila orangnya memilih kartu yang keliru — tetap diarahkan
      // ke tempat yang benar sesuai perannya.
      if (profile.role !== peranDipilih && SALINAN[profile.role]) {
        errEl.textContent = `Akun ini terdaftar sebagai ${profile.role}. Mengalihkan…`;
        errEl.hidden = false;
      }
      arahkan(profile.role);
    });

    // Sesi yang masih hidup langsung diteruskan, tanpa login ulang
    (async function boot() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { tampilkan('viewRoles'); return; }
      const { profile } = await sbLoadProfile(session.user);
      if (!arahkan(profile.role)) tampilkan('viewRoles');
    })();
  </script>
</body>
</html>
